name: Update V2Ray configs

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC.
    - cron: "0 1,6,10,12,16,19,23 * * *"

permissions:
  contents: read

jobs:
  update:
    name: Parse latest happvpn post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Parse latest Telegram post
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

          TELEGRAM_CHANNEL: happvpn
          GIST_FILENAME: happ.json

          REQUEST_TIMEOUT: "30"
          MAX_SOURCE_SIZE: "10485760"

        run: |
          python parser.py

      # ============================================================
      # Encode happ.json to Base64
      # ============================================================
      - name: Encode JSON to Base64
        run: |
          set -e

          echo "[BASE64] Encoding happ.json..."

          base64 -w 0 happ.json > happ_base64.json

          echo "[BASE64] Done."
          echo "[BASE64] Original size: $(wc -c < happ.json) bytes"
          echo "[BASE64] Base64 size:   $(wc -c < happ_base64.json) bytes"

      # ============================================================
      # Push to GitVerse
      # ============================================================
      - name: Push to GitVerse
        env:
          GV_USER: ${{ secrets.GV_USER }}
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: |
          set -e

          echo "[GITVERSE] Cloning repository..."

          git clone \
            https://${GV_USER}:${GV_TOKEN}@gitverse.ru/mirgittech/happ.git \
            gitverse

          echo "[GITVERSE] Copying Base64 data..."

          cp happ_base64.json gitverse/happ.json

          cd gitverse

          git checkout master

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add happ.json

          git commit \
            -m "Update happ.json $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || {
              echo "[GITVERSE] No changes."
              exit 0
            }

          echo "[GITVERSE] Pushing to master..."

          git push origin master

          echo "[GITVERSE] Done."
          echo "[GITVERSE] File: https://gitverse.ru/mirgittech/happ/content/master/happ.json"
